name: Regenerate Channels JSON

on:
  # Run daily at 2 AM UTC
  schedule:
    - cron: '0 2 * * *'
  # Manual trigger
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      
      - name: Install server dependencies
        run: npm ci
        working-directory: server
      
      - name: Generate channels.json from MongoDB
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: node scripts/generate-channels-json.js
        working-directory: server
      
      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet client/public/data/channels.json || echo "changed=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add client/public/data/channels.json
          git commit -m "chore: regenerate channels.json [skip ci]"
          git push

